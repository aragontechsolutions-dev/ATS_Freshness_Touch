name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite lanzar la verificacion a mano desde la pestana Actions.
  #
  # Hace falta porque GitHub NO dispara workflows por eventos que genera una
  # aplicacion (abrir un pull request desde la API con el token de una app),
  # asi que un pull request cuyos commits se subieron ANTES de abrirlo se
  # quedaba sin ejecutar CI y sin forma de lanzarla salvo empujando otro
  # commit.
  workflow_dispatch:

# Cancela ejecuciones antiguas de la misma rama para no gastar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # La version de pnpm NO se indica aqui: se toma del campo
      # "packageManager" de package.json. Declararla en los dos sitios hace
      # fallar la accion con "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Comprobacion de tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Auditoria de dependencias
        # Informativo: no bloquea el merge, pero deja constancia en el log.
        run: pnpm audit --audit-level high || true
