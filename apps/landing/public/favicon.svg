<!--
  Favicon de Freshness Touch.

  A 16 pixeles (que es como se ve de verdad en una pestana) el tejado y el
  girasol juntos se convierten en una mancha ilegible: se comprobo renderizando
  ambas opciones a 16, 32, 48 y 180 px. Por eso el icono pequeno conserva solo
  el girasol y la onda sobre el azul de marca, que siguen siendo reconocibles.
  El isotipo completo (girasol + tejado + onda) se usa en la cabecera del sitio
  y en el icono de pantalla de inicio, donde hay tamano suficiente.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#145788" />

  <path d="M10 52c7-4.5 14 3 21-.5s12-3.5 19 .5" fill="none" stroke="#f9c400"
        stroke-width="4.5" stroke-linecap="round" />

  <g transform="translate(32 27)">
    <g fill="#f9c400">
      <ellipse rx="4.2" ry="9.2" cy="-11.6" />
      <ellipse rx="4.2" ry="9.2" cy="-11.6" transform="rotate(45)" />
      <ellipse rx="4.2" ry="9.2" cy="-11.6" transform="rotate(90)" />
      <ellipse rx="4.2" ry="9.2" cy="-11.6" transform="rotate(135)" />
      <ellipse rx="4.2" ry="9.2" cy="-11.6" transform="rotate(180)" />
      <ellipse rx="4.2" ry="9.2" cy="-11.6" transform="rotate(225)" />
      <ellipse rx="4.2" ry="9.2" cy="-11.6" transform="rotate(270)" />
      <ellipse rx="4.2" ry="9.2" cy="-11.6" transform="rotate(315)" />
    </g>
    <circle r="8" fill="#0c3552" />
    <circle r="3.4" fill="#f9c400" />
  </g>
</svg>
