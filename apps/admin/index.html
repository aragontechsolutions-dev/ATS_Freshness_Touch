<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#145788" />

    <!--
      El panel NO debe aparecer en ningun buscador. La cabecera X-Robots-Tag
      de vercel.json es la que de verdad manda (esta funciona aunque el
      buscador no ejecute JavaScript), pero se repite aqui como respaldo por
      si el sitio se sirve alguna vez desde otro sitio sin esa cabecera.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

    <title>Freshness Touch · Panel</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />

    <!--
      iOS NO LEE EL MANIFIESTO para el icono de la pantalla de inicio: usa
      este enlace y solo este. Sin el, al anadir el panel a la pantalla de
      inicio de un iPhone sale una captura borrosa de la pagina en vez del
      isotipo.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!--
      Y tampoco lee `display: standalone`: esta es la unica forma de que en
      iOS se abra a pantalla completa, sin la barra de Safari.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Freshness" />

    <!--
      Aplica el tema y decide si se permite el movimiento ANTES del primer
      pintado. Va aqui, sincrono y sin `defer`, a proposito: si se retrasara,
      el panel se veria un instante en claro antes de pasar a oscuro.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
