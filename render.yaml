# Infraestructura de la API en Render (Infrastructure as Code).
# Importar desde el panel de Render: Blueprints > New Blueprint Instance.
services:
  - type: web
    name: freshness-touch-api
    runtime: node
    region: ohio

    # IMPORTANTE: NO usar el plan gratuito.
    # El plan free suspende el servicio tras 15 minutos de inactividad y el
    # primer arranque tarda entre 30 y 60 segundos. Para un cotizador eso
    # significa que el visitante ve un error y se va. El plan starter mantiene
    # el servicio siempre encendido.
    plan: starter

    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@freshness/api

    # MIGRACIONES AUTOMATICAS
    # -----------------------
    # Render ejecuta este comando DESPUES de compilar y ANTES de enviar
    # trafico a la version nueva. Es el momento correcto para migrar:
    #   - Si la migracion falla, el despliegue se aborta y la version
    #     anterior sigue atendiendo. No queda una version nueva contra una
    #     base de datos a medio migrar.
    #   - Las credenciales ya viven en Render: no hay que duplicarlas en
    #     GitHub ni en ningun otro sitio.
    #
    # `prisma migrate deploy` solo aplica las migraciones pendientes y nunca
    # borra datos por su cuenta: si no hay ninguna, no hace nada.
    #
    # Mientras DIRECT_URL no este configurada, el paso se omite en vez de
    # fallar, para que un despliegue no se caiga por una variable que
    # todavia no se ha rellenado.
    preDeployCommand: '[ -z "$DIRECT_URL" ] && echo ''DIRECT_URL no configurada: se omiten las migraciones'' || pnpm --filter @freshness/api db:deploy'

    startCommand: node apps/api/dist/main.js

    # Render reinicia el servicio si esta sonda deja de responder.
    healthCheckPath: /health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: API_PREFIX
        value: api/v1

      # Dominios del sitio publico. Sustituir por los reales de Vercel.
      - key: CORS_ORIGINS
        sync: false

      # mock | google. Empezar en "mock" y cambiar cuando haya clave y
      # facturacion activa en Google Cloud.
      - key: DISTANCE_PROVIDER
        value: mock
      # Secreto: se introduce a mano en el panel, nunca en el repositorio.
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # --- Base de datos (Supabase) ---
      # Secretos: se introducen a mano en el panel, nunca en el repositorio.
      # DATABASE_URL: conexion AGRUPADA (puerto 6543), la que usa la aplicacion.
      - key: DATABASE_URL
        sync: false
      # DIRECT_URL: conexion DIRECTA (puerto 5432), solo para las migraciones.
      - key: DIRECT_URL
        sync: false

      - key: DISTANCE_CACHE_TTL_SECONDS
        value: '86400'
      - key: DISTANCE_CACHE_MAX_ENTRIES
        value: '5000'
      - key: DISTANCE_TIMEOUT_MS
        value: '5000'

      # --- Identidad del personal (panel de administracion) ---
      # local | supabase. "local" emite sus propios tokens para desarrollar
      # sin Supabase, y la API SE NIEGA A ARRANCAR con el en produccion:
      # quien conozca AUTH_LOCAL_SECRET podria entrar como administrador.
      - key: AUTH_PROVIDER
        value: supabase
      # https://<ref>.supabase.co — obligatoria con AUTH_PROVIDER=supabase.
      - key: SUPABASE_URL
        sync: false
      # Solo para proyectos ANTIGUOS de Supabase, que todavia firman con un
      # secreto compartido. Los proyectos actuales usan claves asimetricas y
      # no la necesitan: dejarla vacia es lo correcto.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AUTH_TIMEOUT_MS
        value: '5000'

      # --- Pagos ---
      # mock | stripe. Con "mock" los depositos se SIMULAN: no se retiene
      # dinero real. Sirve para desplegar y probar el flujo completo antes de
      # tener cuenta de Stripe; la API avisa por error en los registros
      # mientras siga asi en produccion.
      - key: PAYMENT_PROVIDER
        value: mock
      # Secretos: se introducen a mano en el panel, nunca en el repositorio.
      # STRIPE_SECRET_KEY:     clave secreta de la cuenta (sk_live_... ).
      # STRIPE_WEBHOOK_SECRET: secreto del endpoint de webhook (whsec_...),
      #                        que es DISTINTO de la clave secreta. Sin el, no
      #                        hay forma de comprobar que un aviso de "deposito
      #                        autorizado" viene de verdad de Stripe.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_TIMEOUT_MS
        value: '10000'

      # --- AVISOS (ver docs/14-avisos.md) ---------------------------------
      # "log" no envia nada: escribe el correo en los registros. Permite
      # desplegar y probar sin cuenta de proveedor. La API avisa por error en
      # los registros mientras siga asi en produccion, porque significa que
      # ningun cliente recibe su confirmacion.
      - key: EMAIL_PROVIDER
        value: log
      # Secretos y remitente: a mano en el panel de Render.
      # RESEND_API_KEY: clave de la cuenta (re_...).
      # EMAIL_FROM:     "Freshness Touch <hola@tu-dominio.com>". El dominio
      #                 debe estar VERIFICADO en Resend (SPF y DKIM) o los
      #                 correos acaban en la carpeta de no deseado.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_TIMEOUT_MS
        value: '10000'
      # Token del bot, tal y como lo entrega BotFather. ES una credencial:
      # quien lo tiene ES el bot. El chat de destino NO va aqui, se configura
      # desde el panel. Sin token, el sistema funciona y el aviso queda
      # anotado como fallido con su motivo.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_TIMEOUT_MS
        value: '10000'
      # Dias que dura la retencion. Siete es el maximo de las redes de tarjetas.
      - key: PAYMENT_AUTHORIZATION_DAYS
        value: '7'
      # Texto que ve el cliente en su extracto bancario. Si no lo reconoce,
      # reclama al banco, y eso cuesta dinero y reputacion.
      - key: PAYMENT_STATEMENT_DESCRIPTOR
        value: FRESHNESS

      - key: RATE_LIMIT_TTL_SECONDS
        value: '60'
      - key: RATE_LIMIT_MAX
        value: '60'
      - key: QUOTE_RATE_LIMIT_MAX
        value: '10'

      - key: COMPANY_BASE_CITY
        sync: false
      - key: COMPANY_BASE_STATE
        sync: false
      - key: COMPANY_BASE_POSTAL_CODE
        sync: false
